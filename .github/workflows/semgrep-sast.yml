name: semgrep SAST

on:
  push:
    branches:
      - '**'

jobs:
  semgrep-scan:
    name: Run Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run semgrep
        run: |
          semgrep --config p/ci || true
